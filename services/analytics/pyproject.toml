[project]
name = "market-war-room-analytics"
version = "0.3.0"
description = "Analytics service for Market War Room. Phase 3: deterministic regime engine."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
